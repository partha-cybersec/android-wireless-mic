plugins {
    id 'com.android.application'
}

android {
    namespace 'com.partha.smartkey'
    compileSdk 34

    defaultConfig {
        applicationId 'com.partha.smartkey'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
